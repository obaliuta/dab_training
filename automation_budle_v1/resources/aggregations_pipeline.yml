# The main pipeline for automation_budle_v1

resources:
  pipelines:
    aggregations_pipeline:
      name: aggregations_pipeline
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true

      configuration:
        catalog: ${var.catalog}
        schema: ${var.schema}
      root_path: "../src/aggregations_pipeline"

      libraries:
        - glob:
            include: ../src/aggregations_pipeline/transformations/**
