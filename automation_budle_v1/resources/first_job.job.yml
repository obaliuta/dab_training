# A sample job for automation_budle_v1.

resources:
  jobs:
    first_job:
      name: first_job

      trigger:
        # Run this job every day, exactly one day from the last run; see https://docs.databricks.com/api/workspace/jobs/create#trigger
        periodic:
          interval: 1
          unit: DAYS

      #email_notifications:
      #  on_failure:
      #    - your_email@example.com

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      tasks:
        - task_key: notebook_writing_summary
          notebook_task:
            notebook_path: ../src/writing_summary_notebook.ipynb
          compute:
            hardware_accelerator: GPU_1xA10
          environment_key: default
        - task_key: refresh_pipeline
          depends_on:
            - task_key: notebook_writing_summary
          pipeline_task:
            pipeline_id: ${resources.pipelines.aggregations_pipeline.id}

        - depends_on:
            - task_key: refresh_pipeline
          environment_key: default
          notebook_task:
            notebook_path: ../src/notebook_2.ipynb
          task_key: notebook_2
      environments:
        - environment_key: default
          spec:
            environment_version: "5"
